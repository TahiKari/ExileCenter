name: ExileCenter - compilation et Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existant à compiler (ex. v1.6.0)'
        required: true
        type: string
      draft:
        description: 'Préparer une Release en brouillon'
        default: true
        type: boolean
      native_only:
        description: 'Compiler uniquement le codec autonome pour validation'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  native:
    if: github.repository == 'TahiKari/ExileCenter' && github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.native_only && github.ref || inputs.tag || github.ref }}
          persist-credentials: false
      - name: Compiler le codec libre et préparer ses sources
        shell: pwsh
        run: ./scripts/build-corpse-codec.ps1
      - name: Compiler et tester la caméra autonome
        shell: pwsh
        run: ./scripts/build-camera.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: camera-native
          path: |
            Plugins/CameraZoom/Native/bin/ExileCenter.Camera.dll
            Plugins/CameraZoom/Native/bin/ExileCenter.Camera.dll.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: corpse-codec
          path: |
            Plugins/CorpseCleaner/Native/bin/ExileCenter.ArchiveCodec.dll
            Plugins/CorpseCleaner/Native/bin/ExileCenter.ArchiveCodec.dll.sha256
            Plugins/CorpseCleaner/Native/bin/ExileCenter.ArchiveCodec-sources.zip
          if-no-files-found: error
  release:
    # Evaluated before allocating a runner: only the public ExileCenter repository builds.
    needs: native
    if: github.repository == 'TahiKari/ExileCenter' && github.event.repository.private == false && !inputs.native_only
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_DRAFT: ${{ github.event_name == 'push' || inputs.draft }}
      GH_TOKEN: ${{ github.token }}
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Installer le SDK .NET sur la machine GitHub
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: corpse-codec
          path: Plugins/CorpseCleaner/Native/bin
      - uses: actions/download-artifact@v4
        with:
          name: camera-native
          path: Plugins/CameraZoom/Native/bin

      - name: Compiler le cœur et les plugins sans reconstruire GameOffsets
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') { throw 'Tag de version invalide.' }
          $offsets = Join-Path $PWD '.github/ci/GameOffsets.dll'
          $expected = 'EF67411C6456DE8E92179ED8DB55ADC043D086B072ED37AE52E1109F966F9B93'
          if ((Get-FileHash $offsets -Algorithm SHA256).Hash -ne $expected) { throw 'GameOffsets.dll a changé.' }
          $targets = Join-Path $PWD '.github/ci/PreserveOffsets.targets'
          $properties = @("-p:DirectoryBuildTargetsPath=$targets", "-p:PinnedGameOffsetsPath=$offsets", "-p:ExileCenterReleaseTag=$env:RELEASE_TAG")
          $plugins = [regex]::Matches((Get-Content ExileCenter.sln -Raw), '"(Plugins\\[^"\r\n]+\.csproj)"') |
            ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique
          if (!$plugins) { throw 'Aucun plugin dans la solution.' }
          foreach ($project in @('ExileCenter/ExileCenter.csproj') + @($plugins)) {
            & dotnet restore $project --source https://api.nuget.org/v3/index.json @properties
            if ($LASTEXITCODE -ne 0) { throw "Échec de restauration : $project" }
            & dotnet build $project -c Release --no-restore -p:BuildProjectReferences=false @properties
            if ($LASTEXITCODE -ne 0) { throw "Échec de compilation : $project" }
          }
          & dotnet restore Launcher/Launcher.csproj --source https://api.nuget.org/v3/index.json @properties
          if ($LASTEXITCODE -ne 0) { throw 'Restauration du programme de migration impossible.' }
          & dotnet build Launcher/Launcher.csproj -c Release --no-restore -p:AssemblyName=GameHelper -o "$env:RUNNER_TEMP/exilecenter-migration" @properties
          if ($LASTEXITCODE -ne 0) { throw 'Compilation du programme de migration impossible.' }
          & dotnet restore Downloader/Downloader.csproj --source https://api.nuget.org/v3/index.json -r win-x64 -p:PublishSingleFile=true
          if ($LASTEXITCODE -ne 0) { throw 'Restauration du telechargeur ExileCenter impossible.' }
          & dotnet publish Downloader/Downloader.csproj -c Release --no-restore -r win-x64 --self-contained false -p:PublishSingleFile=true -p:ExileCenterReleaseTag=$env:RELEASE_TAG -o "$env:RUNNER_TEMP/exilecenter-downloader"
          if ($LASTEXITCODE -ne 0) { throw 'Compilation du telechargeur ExileCenter impossible.' }
          $runtime = Join-Path $PWD 'ExileCenter/bin/Release/net10.0-windows/win-x64'
          # Some older plugin projects do not deploy their localization files.
          $localizations = @(git ls-files -- 'Plugins/*/Localization/*.json')
          if ($LASTEXITCODE -ne 0 -or !$localizations) { throw 'Liste des traductions indisponible.' }
          foreach ($path in $localizations) {
            $destination = Join-Path $runtime $path
            [void][IO.Directory]::CreateDirectory((Split-Path $destination -Parent))
            Copy-Item -LiteralPath $path -Destination $destination
          }
          $native = Join-Path $runtime 'runtimes/win-x64/native'
          if (Test-Path $native) {
            Get-ChildItem $native -Filter '*.dll' -File | Copy-Item -Destination $runtime
          }
          if ((Get-FileHash "$runtime/GameOffsets.dll" -Algorithm SHA256).Hash -ne $expected) { throw 'GameOffsets.dll modifiée dans le résultat.' }
          foreach ($project in $plugins) {
            [xml]$xml = Get-Content $project -Raw
            $assemblyName = @($xml.Project.PropertyGroup.AssemblyName | Where-Object { $_ }) | Select-Object -Last 1
            if (!$assemblyName) { $assemblyName = [IO.Path]::GetFileNameWithoutExtension($project) }
            if (!(Test-Path "$runtime/Plugins/$assemblyName/$assemblyName.dll")) { throw "Plugin absent du paquet : $assemblyName" }
          }

      - name: Vérifier l’installation et les réglages de caméra en isolation
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = Join-Path $env:RUNNER_TEMP 'camera-managed-checks'
          [void][IO.Directory]::CreateDirectory($checks)
          Copy-Item scripts/check-camera.cs (Join-Path $checks 'Program.cs')
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><PlatformTarget>x64</PlatformTarget><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup></Project>' | Set-Content (Join-Path $checks 'CameraChecks.csproj')
          & dotnet build (Join-Path $checks 'CameraChecks.csproj') -c Release --nologo
          if ($LASTEXITCODE) { throw 'Compilation des contrôles caméra impossible.' }
          $runner = Join-Path $PWD 'scripts/run-check.ps1'
          $runtime = Join-Path $PWD 'ExileCenter/bin/Release/net10.0-windows/win-x64'
          Push-Location $checks
          try {
            & $runner (Join-Path $checks 'bin/Release/net10.0-windows/CameraChecks.dll') $runtime
            if ($LASTEXITCODE) { throw 'Contrôles caméra échoués.' }
          } finally { Pop-Location }

      - name: Préparer et vérifier le ZIP complet
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $PWD 'ExileCenter/bin/Release/net10.0-windows/win-x64'
          $output = Join-Path $env:RUNNER_TEMP 'exilecenter-release'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $releaseName = "ExileCenter $version"
          if ($env:RELEASE_TAG -match '-personnalise\.(\d+)$') {
            $version = '1.' + [Math]::Max(0, [int]$Matches[1] - 5)
            $releaseName = "ExileCenter P-V$version"
          }
          "RELEASE_NAME=$releaseName" >> $env:GITHUB_ENV
          & ./scripts/publish.ps1 -LocalUpdate -SkipBuild -LocalSource $runtime -LocalDestination $output -LocalLabel $releaseName -Version $env:RELEASE_TAG -Changelog 'ExileCenter : consulter les notes de cette Release.'
          $manifest = Get-Content "$output/ExileCenter-Maj.json" -Raw | ConvertFrom-Json
          $archive = Join-Path $output $manifest.PackageFile
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            foreach ($name in @('ExileCenter.exe', 'ExileCenter.dll', 'ExileCenter.deps.json', 'ExileCenter.runtimeconfig.json', 'GameOffsets.dll', 'cimgui.dll', 'LICENSE', 'CREDITS.md', 'README.md', 'SECURITY.md')) {
              if (!$zip.GetEntry($name)) { throw "Fichier indispensable absent : $name" }
            }
            foreach ($path in @(git ls-files -- 'Plugins/*/Localization/*.json')) {
              if (!$zip.GetEntry($path)) { throw "Traduction absente du ZIP : $path" }
            }
            foreach ($file in @('ExileCenter.ArchiveCodec.dll', 'ExileCenter.ArchiveCodec-sources.zip', 'ArchiveCodec-NOTICE.txt', 'ArchiveCodec-COPYING.txt')) {
              if (!$zip.GetEntry("Plugins/CorpseCleaner/$file")) { throw "Codec autonome incomplet : $file" }
            }
            if (!$zip.GetEntry('Plugins/CameraZoom/ExileCenter.Camera.dll')) { throw 'Caméra autonome absente du ZIP.' }
            if ($zip.Entries.FullName -match '(?i)(^|/)oo2core[^/]*\.dll$') { throw 'Une bibliothèque Oodle propriétaire ne doit pas être distribuée.' }
            if ($zip.Entries.FullName -match '(?i)(^|/)(configs?|settings\.json)(/|$)|(?i)(dump|\.pdb$|\.log$)') { throw 'Données locales ou de diagnostic présentes dans le ZIP.' }
            if ($zip.Entries.FullName -match '(?i)GameHelper') { throw 'Ancien nom dans le paquet complet ExileCenter.' }
          } finally { $zip.Dispose() }
          $download = Join-Path $output 'ExileCenter-Complete-win-x64.zip'
          Move-Item -LiteralPath $archive -Destination $download
          if ((Get-Item $download).Length -ge 2GB) { throw 'ZIP trop volumineux pour GitHub Releases.' }
          $hash = (Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ExileCenter-Complete-win-x64.zip" | Set-Content "$download.sha256" -Encoding utf8NoBOM
          # Retain old download URLs while their installers migrate themselves.
          & ./scripts/publish.ps1 -LocalUpdate -SkipBuild -TransitionPackage -MigrationSource "$env:RUNNER_TEMP/exilecenter-migration" -LocalSource $runtime -LocalDestination $output -LocalLabel $releaseName -Version $env:RELEASE_TAG -Changelog 'Migration des anciens fichiers vers ExileCenter.'
          $transitionManifest = Get-Content "$output/ExileCenter-Maj.json" -Raw | ConvertFrom-Json
          $transition = Join-Path $output 'ExileCenter-win-x64.zip'
          Move-Item -LiteralPath (Join-Path $output $transitionManifest.PackageFile) -Destination $transition
          $transitionHash = (Get-FileHash $transition -Algorithm SHA256).Hash.ToLowerInvariant()
          "$transitionHash  ExileCenter-win-x64.zip" | Set-Content "$transition.sha256" -Encoding utf8NoBOM
          $legacy = Join-Path $output 'GameHelper-Personnalise-win-x64.zip'
          Copy-Item -LiteralPath $transition -Destination $legacy
          "$transitionHash  GameHelper-Personnalise-win-x64.zip" | Set-Content "$legacy.sha256" -Encoding utf8NoBOM
          @"
          $releaseName — le compagnon de TahiKari pour Path of Exile 2 sur Windows x64.
          Télécharger : https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/ExileCenter-Complete-win-x64.zip
          Installation : extraire le ZIP dans un dossier puis lancer ExileCenter.exe.
          Nécessite le runtime .NET 10 Desktop x64. GameOffsets.dll est conservée sans recompilation.
          Les nouvelles installations utilisent le profil de base de TahiKari ; les mises à jour conservent les réglages existants. Le code correspondant est disponible au tag $env:RELEASE_TAG.
          Après cette première installation, les nouvelles Releases sont proposées au démarrage (Oui/Non) ou signalées dans l'application.
          Le bouton « Mettre à jour et redémarrer » télécharge, vérifie et installe la mise à jour en conservant vos réglages.
          "@ | Set-Content "$output/notes.txt" -Encoding utf8NoBOM
          "RELEASE_OUTPUT=$output" >> $env:GITHUB_ENV

      - name: Publier dans les Releases de ce dépôt
        run: |
          $ErrorActionPreference = 'Stop'
          $output = $env:RELEASE_OUTPUT
          Copy-Item "$env:RUNNER_TEMP/exilecenter-downloader/ExileCenterDownloader.exe" "$output/ExileCenterDownloader.exe"
          $options = @('--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--title', $env:RELEASE_NAME, '--notes-file', "$output/notes.txt")
          if ($env:RELEASE_DRAFT -eq 'true') { $options += '--draft' }
          & gh release create $env:RELEASE_TAG "$output/ExileCenter-Complete-win-x64.zip#Télécharger $env:RELEASE_NAME — Windows x64 (ZIP)" "$output/ExileCenter-Complete-win-x64.zip.sha256" "$output/ExileCenterDownloader.exe#Telechargeur ExileCenter" "$output/ExileCenter-win-x64.zip#Migration des anciennes installations" "$output/ExileCenter-win-x64.zip.sha256" "$output/GameHelper-Personnalise-win-x64.zip#Compatibilité avec les anciens installateurs" "$output/GameHelper-Personnalise-win-x64.zip.sha256" @options
          if ($LASTEXITCODE -ne 0) { throw 'Échec de publication de la Release.' }
          "Release : https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
