name: GameHelper - compilation et Release gratuite

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existant à compiler (ex. v1.5.11-personnalise.1)'
        required: true
        type: string
      draft:
        description: 'Préparer une Release en brouillon'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Evaluated before allocating a runner: private repos and other forks skip.
    if: github.repository == 'TahiKari/Gamehelper2' && github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_DRAFT: ${{ github.event_name == 'push' || inputs.draft }}
      GH_TOKEN: ${{ github.token }}
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Installer le SDK .NET sur la machine GitHub
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compiler le cœur et les plugins sans reconstruire GameOffsets
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') { throw 'Tag de version invalide.' }
          $offsets = Join-Path $PWD '.github/ci/GameOffsets.dll'
          $expected = 'EF67411C6456DE8E92179ED8DB55ADC043D086B072ED37AE52E1109F966F9B93'
          if ((Get-FileHash $offsets -Algorithm SHA256).Hash -ne $expected) { throw 'GameOffsets.dll a changé.' }
          $targets = Join-Path $PWD '.github/ci/PreserveOffsets.targets'
          $properties = @("-p:DirectoryBuildTargetsPath=$targets", "-p:PinnedGameOffsetsPath=$offsets", "-p:GameHelperReleaseTag=$env:RELEASE_TAG")
          $plugins = [regex]::Matches((Get-Content GameOverlay.sln -Raw), '"(Plugins\\[^"\r\n]+\.csproj)"') |
            ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique
          if (!$plugins) { throw 'Aucun plugin dans la solution.' }
          foreach ($project in @('GameHelper/GameHelper.csproj') + @($plugins)) {
            & dotnet restore $project --source https://api.nuget.org/v3/index.json @properties
            if ($LASTEXITCODE -ne 0) { throw "Échec de restauration : $project" }
            & dotnet build $project -c Release --no-restore -p:BuildProjectReferences=false @properties
            if ($LASTEXITCODE -ne 0) { throw "Échec de compilation : $project" }
          }
          $runtime = Join-Path $PWD 'GameHelper/bin/Release/net10.0-windows/win-x64'
          # Some older plugin projects do not deploy their localization files.
          $localizations = @(git ls-files -- 'Plugins/*/Localization/*.json')
          if ($LASTEXITCODE -ne 0 -or !$localizations) { throw 'Liste des traductions indisponible.' }
          foreach ($path in $localizations) {
            $destination = Join-Path $runtime $path
            [void][IO.Directory]::CreateDirectory((Split-Path $destination -Parent))
            Copy-Item -LiteralPath $path -Destination $destination
          }
          $native = Join-Path $runtime 'runtimes/win-x64/native'
          if (Test-Path $native) {
            Get-ChildItem $native -Filter '*.dll' -File | Copy-Item -Destination $runtime
          }
          if ((Get-FileHash "$runtime/GameOffsets.dll" -Algorithm SHA256).Hash -ne $expected) { throw 'GameOffsets.dll modifiée dans le résultat.' }
          foreach ($project in $plugins) {
            [xml]$xml = Get-Content $project -Raw
            $assemblyName = @($xml.Project.PropertyGroup.AssemblyName | Where-Object { $_ }) | Select-Object -Last 1
            if (!$assemblyName) { $assemblyName = [IO.Path]::GetFileNameWithoutExtension($project) }
            if (!(Test-Path "$runtime/Plugins/$assemblyName/$assemblyName.dll")) { throw "Plugin absent du paquet : $assemblyName" }
          }

      - name: Préparer et vérifier le ZIP complet
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $PWD 'GameHelper/bin/Release/net10.0-windows/win-x64'
          $output = Join-Path $env:RUNNER_TEMP 'gamehelper-release'
          & ./scripts/publish.ps1 -LocalUpdate -SkipBuild -LocalSource $runtime -LocalDestination $output -LocalLabel "GameHelper personnalisé $env:RELEASE_TAG"
          $manifest = Get-Content "$output/GameHelper-Maj.json" -Raw | ConvertFrom-Json
          $archive = Join-Path $output $manifest.PackageFile
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::Open($archive, [IO.Compression.ZipArchiveMode]::Update)
          try {
            foreach ($name in @('LICENSE', 'CREDITS.md', 'README.md')) {
              [void][IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, (Join-Path $PWD $name), $name)
            }
          } finally { $zip.Dispose() }
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            foreach ($name in @('GameHelper.exe', 'GameHelper.App.exe', 'GameHelper.dll', 'GameHelper.deps.json', 'GameHelper.runtimeconfig.json', 'GameOffsets.dll', 'cimgui.dll', 'LICENSE')) {
              if (!$zip.GetEntry($name)) { throw "Fichier indispensable absent : $name" }
            }
            foreach ($path in @(git ls-files -- 'Plugins/*/Localization/*.json')) {
              if (!$zip.GetEntry($path)) { throw "Traduction absente du ZIP : $path" }
            }
            if ($zip.Entries.FullName -match '(?i)(^|/)(configs?|settings\.json)(/|$)|(?i)(dump|\.pdb$|\.log$)') { throw 'Données locales ou de diagnostic présentes dans le ZIP.' }
          } finally { $zip.Dispose() }
          $download = Join-Path $output 'GameHelper-Personnalise-win-x64.zip'
          Move-Item -LiteralPath $archive -Destination $download
          if ((Get-Item $download).Length -ge 2GB) { throw 'ZIP trop volumineux pour GitHub Releases.' }
          $hash = (Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GameHelper-Personnalise-win-x64.zip" | Set-Content "$download.sha256" -Encoding utf8NoBOM
          @"
          GameHelper personnalisé pour Windows x64. Extraire le ZIP dans un dossier puis lancer GameHelper.exe.
          Nécessite le runtime .NET 10 Desktop x64. GameOffsets.dll est conservée sans recompilation.
          Les paramètres personnels ne sont pas inclus. Le code correspondant est disponible au tag $env:RELEASE_TAG.
          Après cette première installation, les nouvelles Releases sont proposées au démarrage (Oui/Non) ou signalées dans l'application.
          Le bouton « Mettre à jour et redémarrer » télécharge, vérifie et installe la mise à jour en conservant vos réglages.
          "@ | Set-Content "$output/notes.txt" -Encoding utf8NoBOM
          "RELEASE_OUTPUT=$output" >> $env:GITHUB_ENV

      - name: Publier dans les Releases de ce dépôt
        run: |
          $ErrorActionPreference = 'Stop'
          $output = $env:RELEASE_OUTPUT
          $options = @('--repo', $env:GITHUB_REPOSITORY, '--verify-tag', '--title', "GameHelper personnalisé $env:RELEASE_TAG", '--notes-file', "$output/notes.txt")
          if ($env:RELEASE_DRAFT -eq 'true') { $options += '--draft' }
          & gh release create $env:RELEASE_TAG "$output/GameHelper-Personnalise-win-x64.zip" "$output/GameHelper-Personnalise-win-x64.zip.sha256" @options
          if ($LASTEXITCODE -ne 0) { throw 'Échec de publication de la Release.' }
          "Release : https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
